# Traefik overlay — use this when an existing Traefik instance handles port 80/443.
# Usage: docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
#
# Required .env.local vars:
#   TRAEFIK_HOST=vps.sakitha.com       # domain Traefik should route
#   TRAEFIK_NETWORK=vps-monitor_proxy  # external Docker network Traefik is on
# Recommended .env.local vars:
#   TRAEFIK_CONTAINER=<traefik container name>   # `scripts/trust-traefik.sh` writes it
#   (or CADDY_TRUSTED_PROXIES="<ip>/32 …" to pin addresses; "private_ranges" to opt out)
#
# Caddy handles internal routing; Traefik only terminates TLS externally.

services:
  caddy:
    # scripts/caddy-entrypoint.sh decides whose X-Forwarded-For Caddy believes:
    # CADDY_TRUSTED_PROXIES if set, else the address(es) of the container(s) named in
    # TRAEFIK_CONTAINER (default "traefik") on the shared network. Trusting only Traefik
    # matters because apps deployed by PulseNode share this network and can reach Caddy
    # directly — with `private_ranges` they could forge X-Forwarded-For and so the rate-limit
    # key and the audit-log IP. If Traefik cannot be resolved the script falls back to
    # private_ranges and logs a warning; run scripts/trust-traefik.sh to record the name.
    # (The login lockout is per account regardless.)
    entrypoint: ["/bin/sh", "/usr/local/bin/pn-caddy-entrypoint.sh"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./scripts/caddy-entrypoint.sh:/usr/local/bin/pn-caddy-entrypoint.sh:ro
    environment:
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-}
      TRAEFIK_CONTAINER: ${TRAEFIK_CONTAINER:-traefik}
    networks:
      - default
      - traefik-net
    labels:
      traefik.enable: "true"
      traefik.http.routers.pulsenode.rule: "Host(`${TRAEFIK_HOST:-vps.sakitha.com}`)"
      traefik.http.routers.pulsenode.entrypoints: "websecure"
      traefik.http.routers.pulsenode.tls.certresolver: "letsencrypt"
      traefik.http.services.pulsenode.loadbalancer.server.port: "80"
      traefik.docker.network: "${TRAEFIK_NETWORK:-vps-monitor_proxy}"

networks:
  traefik-net:
    external: true
    name: ${TRAEFIK_NETWORK:-vps-monitor_proxy}
