# json-file log rotation for every panel service (Docker's default never rotates).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
    depends_on:
      - web
      - go-api
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *logging
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 32M

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_GO_API: ${NEXT_PUBLIC_GO_API:-/go}
    environment:
      GO_API_INTERNAL: http://go-api:4002
    depends_on:
      - go-api
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 40M

  go-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      GO_PORT: 4002
      # Empty or weak secrets are replaced by random ones persisted in /var/lib/pulsenode.
      JWT_SECRET: ${JWT_SECRET:-}
      # One-time token needed to create the first admin account (see SECURITY.md).
      PULSENODE_SETUP_TOKEN: ${PULSENODE_SETUP_TOKEN:-}
      # Set to true ONLY if the dashboard is unreachable from untrusted networks.
      PULSENODE_INSECURE_NO_AUTH: ${PULSENODE_INSECURE_NO_AUTH:-false}
      NEXT_PUBLIC_ORIGIN: ${NEXT_PUBLIC_ORIGIN:-}
      COOLIFY_API_URL: ${COOLIFY_API_URL:-}
      COOLIFY_API_TOKEN: ${COOLIFY_API_TOKEN:-}
      AES_KEY: ${AES_KEY:-}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-3976678}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-pulsenodeapp}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-/workspace/.github-app-key.pem}
      TRAEFIK_NETWORK: ${TRAEFIK_NETWORK:-}
      PULSENODE_ROOT_DOMAIN: ${PULSENODE_ROOT_DOMAIN:-}
      PULSENODE_VPS_IP: ${PULSENODE_VPS_IP:-}
      DATABASE_PATH: /data/pulsenode.db
      PULSENODE_DATA_DIR: /var/lib/pulsenode
      PULSENODE_VERSION: ${PULSENODE_VERSION:-dev}
      PULSENODE_WORKSPACE: /workspace
      PULSENODE_OVERLAY: ${PULSENODE_OVERLAY:-docker-compose.standalone.yml}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
      # Soft Go heap limit, ~80% of PULSENODE_API_MEMORY below. If you lower the
      # container limit, lower this too (e.g. 256M -> 200MiB). Also caps scanners:
      # trivy/syft children get PULSENODE_SCANNER_MEMLIMIT (default 400MiB).
      GOMEMLIMIT: ${PULSENODE_API_GOMEMLIMIT:-600MiB}
      PULSENODE_SCANNER_MEMLIMIT: ${PULSENODE_SCANNER_MEMLIMIT:-400MiB}
      TRIVY_CACHE_DIR: /var/cache/trivy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pn-go-data:/var/lib/pulsenode
      - pn-sqlite-data:/data
      # Trivy vulnerability DB (can reach ~1 GB): its own volume, not the one holding secrets.
      - pn-trivy-cache:/var/cache/trivy
      - ${PULSENODE_INSTALL_DIR:-.}:/workspace
    # go-api is root-equivalent on the host by design: it holds the Docker
    # socket and shares the host PID namespace (process list/kill). Protect it
    # with login (always on), HTTPS, and a firewall — see SECURITY.md.
    pid: "host"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Lets a running build drain and the database checkpoint before Docker SIGKILLs
    # (the app waits up to ~60s: http 10s + deploy queue 45s + background loops).
    stop_grace_period: 70s
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
    deploy:
      resources:
        limits:
          # go-api runs git, nixpacks, docker compose, backups and trivy/syft scans in
          # this one cgroup, so 128M got it OOM-killed. Override on small hosts.
          cpus: ${PULSENODE_API_CPUS:-0.50}
          memory: ${PULSENODE_API_MEMORY:-768M}
        reservations:
          memory: 32M

volumes:
  pn-go-data:
  pn-trivy-cache:
  pn-sqlite-data:
  caddy-data:
  caddy-config:
