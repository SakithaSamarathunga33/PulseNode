name: Release

# Every push to main: run the full CI gate, build and push multi-arch images, and only then
# create the version tag + GitHub release. The tag/release appearing is the signal that
# `:latest` and `:<version>` are already published — the self-updater relies on that order.
on:
  push:
    branches:
      - main

env:
  OWNER: sakithasamarathunga33
  REGISTRY: ghcr.io

permissions:
  contents: read

# One release at a time (the version is computed from the latest tag); never cancel a
# release that is already publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 1) Gate: tests, types, lint, build, compose validation, image build + smoke test.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # 2) Work out the next version WITHOUT creating the tag yet.
  #   feat:            → minor bump  (v1.0.0 → v1.1.0)
  #   fix: / chore: / etc → patch bump  (v1.0.0 → v1.0.1)
  #   BREAKING CHANGE  → major bump  (v1.0.0 → v2.0.0)
  version:
    name: Compute version
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next tag (dry run)
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          dry_run: true

  # 3) Build each image natively per architecture (no QEMU: the Go and Next.js builds are
  #    far too slow emulated) and push by digest.
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [web, go-api]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: web
            name: pulsenode-web
            context: .
            file: Dockerfile
            target: web
          - image: go-api
            name: pulsenode-go-api
            context: ./backend
            file: ./backend/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          # Plain image manifests (no attestation index) so the per-arch digests can be
          # merged into one multi-arch tag below.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 4) Stitch the per-arch images into `:<version>` and `:latest` multi-arch tags.
  merge:
    name: Publish ${{ matrix.image }} tags
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: web
            name: pulsenode-web
          - image: go-api
            name: pulsenode-go-api
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          sources=()
          for f in *; do sources+=("${IMAGE}@sha256:${f}"); done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error::expected 2 per-arch digests (amd64, arm64), found ${#sources[@]}"; exit 1
          fi
          docker buildx imagetools create -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" "${sources[@]}"

      - name: Inspect result
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
          TAG: ${{ needs.version.outputs.tag }}
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}"

  # 5) Vulnerability report on what was just published.
  #    Report-only: third-party CVEs (base images, npm/Go modules) without a released fix
  #    must not block releases. Set `exit-code: '1'` to turn this into a hard gate.
  scan:
    name: Trivy report (${{ matrix.name }})
    continue-on-error: true # report-only: never fail a published release over a scan
    needs: [version, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        name: [pulsenode-web, pulsenode-go-api]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ needs.version.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '0'

  # 6) Only now create the tag and the GitHub release (the tag points at the commit that
  #    was built and tested).
  release:
    name: GitHub release
    needs: [version, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PulseNode ${{ needs.version.outputs.tag }}
          body: |
            ## PulseNode ${{ needs.version.outputs.tag }}

            ### One-command install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/SakithaSamarathunga33/PulseNode/main/install.sh | bash
            ```

            When the installer finishes, it prints your dashboard URL — open it and you're live.

            ### Docker images (GitHub Container Registry, linux/amd64 + linux/arm64)

            | Image | Tags |
            |-------|------|
            | `ghcr.io/sakithasamarathunga33/pulsenode-web` | `${{ needs.version.outputs.tag }}`, `latest` |
            | `ghcr.io/sakithasamarathunga33/pulsenode-go-api` | `${{ needs.version.outputs.tag }}`, `latest` |

            ### Changes
            ${{ needs.version.outputs.changelog }}
          files: install.sh
          generate_release_notes: false
